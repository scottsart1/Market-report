labels:
  - id: USREC
    name: NBER Recession Indicator (monthly)
    source: fred
    frequency: m

# ---------------------------------------------------------------------------
# Breadth composites (src/recession/composites.py): fixed membership of
# long-history features, computed on the as-of panel with trailing windows.
# ---------------------------------------------------------------------------
composites:
  - id: BREADTH_STRESS
    name: Breadth of Recessionary Readings
    kind: breadth_pctile
    category: composite
    members: [SPREAD_10Y3M__level, T1YFF__level, FEDFUNDS__chg24m, BAA10YM__chg6m,
              BAA_AAA__level, PAPER_BILL__level, MTG_SPREAD__level, WILLING_LEND__level,
              ICNSA_4WK__yoy, IURSA__chg6m, U2RATE__chg12m, LNS13023653__yoy,
              AWHI__ann6m, AWHMAN__chg6m, TEMPHELPS__yoy, PAYEMS__ann6m,
              PERMIT1__yoy, HOUST__yoy, MSACSR__z10y, GACDFSA066MSFRBPHI__avg3m,
              NASDAQCOM__ret6m, UMCSENT__chg6m, INDPRO__ann6m, CUMFNS__chg6m]
    transforms:
      - {t: level, risk: 1, desc: "Mean recessionary percentile across 24 long-history indicators"}
      - {t: chg3m, risk: 1, desc: "Breadth of stress, 3-month change"}
      - {t: chg6m, risk: 1, desc: "Breadth of stress, 6-month change"}

  - id: LABOR_ONSET_DIFF
    name: Labor-Market Onset Rules Triggered
    kind: rule_share
    category: composite
    rules:
      - {feature: ICNSA_4WK__yoy, op: ">", value: 0.10}
      - {feature: IURSA__chg3m, op: ">", value: 0.2}
      - {feature: U2_SAHM__level, op: ">", value: 0.3}
      - {feature: SAHM_RT__level, op: ">", value: 0.3}
      - {feature: LNS13023653__yoy, op: ">", value: 0.15}
      - {feature: AWHI__ann3m, op: "<", value: 0.0}
      - {feature: AWHMAN__chg6m, op: "<", value: -0.3}
      - {feature: PAYEMS__ann3m, op: "<", value: 0.005}
      - {feature: TEMPHELPS__yoy, op: "<", value: 0.0}
      - {feature: USCONS__ann6m, op: "<", value: 0.0}
      - {feature: NECDFSA066MSFRBPHI__avg3m, op: "<", value: 0.0}
    transforms:
      - {t: level, risk: 1, desc: "Share of pre-specified labor-onset rules currently triggered"}
      - {t: chg3m, risk: 1, desc: "Labor-onset rules triggered, 3-month change"}

  - id: CURVE_INV_BREADTH
    name: Yield-Curve Inversion Breadth
    kind: inv_share
    category: composite
    members: [SPREAD_10Y3M__level, SPREAD_10Y2Y__level, SPREAD_5Y2Y__level, SPREAD_2Y3M__level,
              T1YFF__level, SPREAD_3M_FF__level, SPREAD_10Y_FF__level]
    transforms:
      - {t: level, risk: 1, desc: "Share of seven curve pairs currently inverted"}
      - {t: avg12m, risk: 1, desc: "Inversion breadth, 1-year average (persistence)"}

  - id: HOUSING_BREADTH
    name: Housing Indicators Deteriorating
    kind: rule_share
    category: composite
    rules:
      - {feature: PERMIT1__yoy, op: "<", value: 0.0}
      - {feature: HOUST__yoy, op: "<", value: 0.0}
      - {feature: HSN1F__yoy, op: "<", value: 0.0}
      - {feature: MSACSR__z10y, op: ">", value: 1.0}
      - {feature: USCONS__ann6m, op: "<", value: 0.0}
      - {feature: REAL_HPI__yoy, op: "<", value: 0.0}
      - {feature: PERMITNE__yoy, op: "<", value: 0.0}
      - {feature: PERMITMW__yoy, op: "<", value: 0.0}
      - {feature: PERMITS__yoy, op: "<", value: 0.0}
      - {feature: PERMITW__yoy, op: "<", value: 0.0}
    transforms:
      - {t: level, risk: 1, desc: "Share of housing indicators deteriorating"}
      - {t: chg6m, risk: 1, desc: "Housing breadth, 6-month change"}

  - id: CREDIT_SUPPLY_STRESS
    name: Credit-Supply Stress (raw components)
    kind: breadth_pctile
    category: composite
    members: [BAA_AAA__level, BAA10YM__chg6m, PAPER_BILL__level, MTG_SPREAD__level,
              WILLING_LEND__level, DRTSCILM__level, BUSLOANS__accel3m, VIX_SPLICED__avg1m, CPFF__avg1m]
    transforms:
      - {t: level, risk: 1, desc: "Mean stress percentile across credit-supply components"}
      - {t: chg3m, risk: 1, desc: "Credit-supply stress, 3-month change"}

  - id: COINC_BIG4
    name: Coincident Momentum (NBER big-four plus hours)
    kind: zmean
    category: composite
    members: [PAYEMS__ann3m, INDPRO__ann3m, W875RX1__ann6m, CMRMTSPL__ann6m, AWHI__ann3m, CE16OV__ann3m]
    transforms:
      - {t: level, risk: -1, desc: "Standardized momentum of the NBER coincident set"}
      - {t: chg3m, risk: -1, desc: "Coincident momentum, 3-month change"}
