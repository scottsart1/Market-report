# Indicator universe for the U.S. recession probability model.
#
# Fields per indicator:
#   id:            series identifier (FRED series id, or internal id for derived series)
#   name:          human-readable name
#   category:      rates | policy | credit | markets | labor | real_activity | housing |
#                  consumer | inflation | alt_hf
#   source:        fred | derived
#   frequency:     d (business daily) | w (weekly) | m (monthly)
#   publication_lag_days: calendar days AFTER the period END until the value is
#                  publicly known. Used to build the point-in-time panel whenever
#                  true ALFRED vintage (first-release) dates are unavailable.
#   vintage:       true if ALFRED first-release data should be used for training
#                  history (revision-prone series). false for market prices that
#                  are never materially revised.
#   tier:          1 = core (long history, high reliability), 2 = supplementary
#                  (shorter history or larger lag; model tolerates their absence).
#   license:       public = public domain / US-government work, fred_full = full
#                  history redistributable via FRED, restricted = licensing limits
#                  history without an API key (auto-substituted by proxies).
#   enabled:       optional, default true.
#   inputs/derive: for derived series, the recipe and its parent series.
#   transforms:    list of {t: transform_code, risk: +1|-1, desc: plain-English}.
#                  risk = +1 means HIGHER transformed value -> HIGHER recession risk.
#                  risk is used only for phrasing and category stress scores,
#                  never as a model input or constraint.
#
# Transform codes are implemented in src/recession/features.py. All transforms
# use trailing data only.

indicators:

  # ---------------------------------------------------------------- rates ----
  - id: DGS10
    name: 10-Year Treasury Yield
    category: rates
    source: fred
    frequency: d
    publication_lag_days: 1
    vintage: false
    tier: 1
    license: public
    transforms:
      - {t: chg3m, risk: -1, desc: "10-year Treasury yield 3-month change"}

  - id: DGS2
    name: 2-Year Treasury Yield
    category: rates
    source: fred
    frequency: d
    publication_lag_days: 1
    vintage: false
    tier: 1
    license: public
    transforms: []

  - id: DGS5
    name: 5-Year Treasury Yield
    category: rates
    source: fred
    frequency: d
    publication_lag_days: 1
    vintage: false
    tier: 1
    license: public
    transforms: []

  - id: DGS1
    name: 1-Year Treasury Yield
    category: rates
    source: fred
    frequency: d
    publication_lag_days: 1
    vintage: false
