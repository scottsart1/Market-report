  - id: SPREAD_10Y3M
    name: 10Y-3M Treasury Spread
    category: rates
    source: derived
    derive: spread
    inputs: [DGS10, DTB3]
    frequency: d
    publication_lag_days: 1
    vintage: false
    tier: 1
    license: public
    transforms:
      - {t: level,      risk: -1, desc: "10Y-3M Treasury spread (level)"}
      - {t: chg3m,      risk: -1, desc: "10Y-3M spread 3-month change"}
      - {t: chg12m,     risk: -1, desc: "10Y-3M spread 12-month change"}
      - {t: inv_share1y, risk: +1, desc: "Share of past year with inverted 10Y-3M curve"}
      - {t: resteep,    risk: +1, desc: "Curve re-steepening after inversion"}
      - {t: since_inv,  risk: -1, desc: "Time elapsed since last 10Y-3M inversion"}
      - {t: lag6m,      risk: -1, desc: "10Y-3M spread six months ago"}
      - {t: lag12m,     risk: -1, desc: "10Y-3M spread a year ago"}
      - {t: min1y,      risk: -1, desc: "10Y-3M spread, 1-year low"}
      - {t: invdepth1y, risk: +1, desc: "Average depth of 10Y-3M inversion over the past year"}
      - {t: invshare2y, risk: +1, desc: "Share of past two years with inverted 10Y-3M curve"}

  - id: SPREAD_10Y2Y
